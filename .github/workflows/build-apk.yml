name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print ($1=="1"?$2:$1)}')
          echo "Detected Java major version: $JAVA_VER"

          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Could not detect active Java version!"
            exit 1
          fi

          if [ "$JAVA_VER" -lt 17 ]; then
            echo "ERROR: Java major version must be 17 or newer. Found version: $JAVA_VER"
            exit 1
          fi

          echo "Java environment verified successfully (version $JAVA_VER >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Debug keystore confirmed present."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK"
            echo "Listing APK files inside app/build/outputs/apk (if any):"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK at $EXPECTED_APK is empty (0 bytes)!"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension"; exit 1 ;;
          esac

          echo "Verified debug APK exists and is valid: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR=$(mktemp -d)
          REPO_RAW="${{ github.repository }}"
          REPO_NAME="${REPO_RAW##*/}"
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9_-]/-/g' -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          RELEASE_FILENAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TEMP_RELEASE_DIR}/${RELEASE_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"

          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $DEST_PATH"
            exit 1
          fi

          echo "Prepared release asset: $DEST_PATH"
          echo "asset_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI Version ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset is missing or empty at $ASSET_PATH"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "ERROR: Asset does not have .apk extension: $ASSET_PATH"; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"

          cat << 'EOF' > release_notes.md
          ### Debug APK Build Information

          This is an automatically generated debug APK built by **GitHub Actions**.

          - **Build Run Number:** #${{ github.run_number }}
          - **Build Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit SHA:** `${{ github.sha }}`

          > ⚠️ **Notice:** This APK is intended for testing purposes only. It is **not** a Play Store production release and is signed only with a temporary debug keystore.

          Download the `.apk` file below under **Assets** to install and test on your Android device.
          EOF

          echo "Creating GitHub Release: $RELEASE_TAG ($RELEASE_TITLE)..."
          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --target "$TARGET_COMMIT" \
            --latest

          rm -f release_notes.md
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "=== Release Publishing Succeeded ==="
            gh release view "$RELEASE_TAG"

            REPO_URL="${{ github.server_url }}/${{ github.repository }}"
            RELEASE_URL="${REPO_URL}/releases/tag/${RELEASE_TAG}"

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_FILENAME"

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Build & Release Succeeded!

          - **Release Tag:** \`$RELEASE_TAG\`
          - **Release Title:** $RELEASE_TITLE
          - **APK Asset:** \`$ASSET_FILENAME\`
          - **Direct Release Page:** [View Release]($RELEASE_URL)

          📲 **Download Instructions:** You can download \`$ASSET_FILENAME\` directly from the **Assets** section of the [GitHub Release page]($RELEASE_URL) to install on your Android device.

          📦 **Backup Actions Artifact:** The standard GitHub Actions artifact named \`app-debug-apk\` is also preserved and available in the run summary.
          EOF
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped."
            echo "Notice: The debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' was uploaded successfully and remains available."

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ Debug APK Built (Release Publishing Warning)

          The debug APK was built successfully, but automatic GitHub Release publishing was not completed (outcome: \`$PUBLISH_OUTCOME\`).

          📦 **Available Artifact:**
          The debug APK is preserved as a standard GitHub Actions artifact named **\`app-debug-apk\`**. You can download it directly from this workflow run's Summary page.
          EOF
          fi
